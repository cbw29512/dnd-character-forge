name: Netlify foundation certification

on:
  push:
    branches: [cert/netlify-foundation-v1]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Netlify build
        run: node --check scripts/netlify-build.mjs
      - name: Verify Netlify production contracts
        run: node --test tests/netlify-production.test.js tests/seo-production.test.js tests/share-route.test.js
