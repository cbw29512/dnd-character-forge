name: Class crest watermark certification

on:
  push:
    branches: [cert/class-crest-watermarks-20260903]

permissions:
  contents: read

concurrency:
  group: class-crest-watermark-cert
  cancel-in-progress: true

jobs:
  crest-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check watermark paths
        run: |
          node --check src/print/class-art.js
          node --check tests/class-crest-watermark.test.js
      - name: Verify watermark and existing print contracts
        run: node --test tests/class-crest-watermark.test.js tests/deluxe-class-signature.test.js tests/premium-print.test.js
      - name: Ensure PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Locate headless Chrome
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify all 12 deluxe class identities with centered crests
        run: node tests/class-identity-browser-print-gate.mjs
      - name: Verify black-and-white and Ink Saver output
        run: node tests/class-signature-ink-saver-browser-gate.mjs
      - name: Upload crest visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-crest-watermark-review
          path: |
            tests/.browser-print/*.pdf
            tests/.browser-print/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
