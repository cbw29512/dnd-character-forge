name: Party Forge browser gate

on:
  pull_request:
    paths:
      - 'src/rules/party-forge.js'
      - 'src/ui/hero-experience.js'
      - 'styles/party-forge.css'
      - 'tests/party-forge-browser-gate.mjs'
      - '.github/workflows/party-forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  party-forge-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate headless Chrome
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify Party Forge in Chrome
        run: node tests/party-forge-browser-gate.mjs
      - name: Upload Party Forge visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-forge-browser-review
          path: tests/.party-forge-browser/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
