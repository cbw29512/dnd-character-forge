name: Party Forge browser gate

on:
  pull_request:
  push:
    branches: [main, cert/party-print-final-20260903]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  party-forge-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Party Print path
        run: node --check src/rules/party-forge.js && node --check src/print/model.js && node --check src/ui/print.js && node --check src/ui/party-print-summary.js && node --check tests/party-print-browser-gate.mjs && node --check tests/print-supplemental-spells.test.js
      - name: Verify Party Forge RAW, DM quick-reference, and supplemental-spell contracts
        run: node --test tests/party-forge.test.js tests/party-print-summary.test.js tests/party-print-summary-style.test.js tests/print-supplemental-spells.test.js
      - name: Locate headless Chrome
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify direct Party Forge print in Chrome
        run: node tests/party-print-browser-gate.mjs
      - name: Verify existing single-character mobile Print/Reforge path
        run: node tests/mobile-action-browser-gate.mjs
      - name: Upload Party Print visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-print-browser-review
          path: tests/.party-print-browser/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
