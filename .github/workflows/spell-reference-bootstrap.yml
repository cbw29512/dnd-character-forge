name: Spell Reference Bootstrap

on:
  push:
    branches:
      - feat/full-2024-spell-reference-20260830
    paths:
      - tools/generate-srd-521-spell-reference.py
      - .github/workflows/spell-reference-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref_name == 'feat/full-2024-spell-reference-20260830'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download official SRD 5.2.1
        run: |
          curl --fail --location --retry 3 \
            'https://media.dndbeyond.com/compendium-images/srd/5.2/SRD_CC_v5.2.1.pdf' \
            --output /tmp/SRD_CC_v5.2.1.pdf
          test -s /tmp/SRD_CC_v5.2.1.pdf
          pdfinfo /tmp/SRD_CC_v5.2.1.pdf | grep -E '^Pages:[[:space:]]+364$'

      - name: Generate static spell-reference catalog
        run: |
          python3 tools/generate-srd-521-spell-reference.py \
            /tmp/SRD_CC_v5.2.1.pdf \
            src/data/spell-reference-2024-generated.js
          grep -q 'SPELL_REFERENCE_2024_GENERATED' src/data/spell-reference-2024-generated.js

      - name: Upload generated catalog for audit
        uses: actions/upload-artifact@v4
        with:
          name: srd-521-spell-reference-generated
          path: src/data/spell-reference-2024-generated.js
          if-no-files-found: error

      - name: Commit generated catalog to feature branch
        run: |
          if git diff --quiet -- src/data/spell-reference-2024-generated.js; then
            echo 'Generated catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/spell-reference-2024-generated.js
          git commit -m 'Generate SRD 5.2.1 spell reference catalog'
          git push origin HEAD:${GITHUB_REF_NAME}
