name: Character Forge tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run rules and site regression suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: test-output.log
          if-no-files-found: warn
          retention-days: 7

  browser-print:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Locate headless Chrome
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify premium PDF packets in Chrome
        run: node tests/browser-print-gate.mjs
      - name: Verify Bard premium PDFs in Chrome
        run: node tests/bard-browser-print-gate.mjs
      - name: Verify Monk premium PDFs in Chrome
        run: node tests/monk-browser-print-gate.mjs
      - name: Verify Sorcerer premium PDFs in Chrome
        run: node tests/sorcerer-browser-print-gate.mjs
      - name: Verify Warlock premium PDFs in Chrome
        run: node tests/warlock-browser-print-gate.mjs
      - name: Upload premium print visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-print-review
          path: |
            tests/.browser-print/*.pdf
            tests/.browser-print/*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
