name: Production site smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact Pages build and live Character Forge
        shell: bash
        env:
          BASE_URL: https://cbw29512.github.io/dnd-character-forge/
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Production smoke failed at line ${LINENO}."' ERR

          pages_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          pages_file="$(mktemp)"
          index_file="$(mktemp)"
          deployment_ready=0

          for attempt in $(seq 1 24); do
            echo "[production-smoke] Pages build attempt ${attempt}/24 for ${GITHUB_SHA}"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "${pages_api}" -o "${pages_file}"; then
              pages_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))' "${pages_file}")"
              pages_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("commit", ""))' "${pages_file}")"
              echo "[production-smoke] latest Pages build status=${pages_status:-missing} commit=${pages_commit:-missing}"

              if [[ "${pages_status}" == "built" && "${pages_commit}" == "${GITHUB_SHA}" ]]; then
                deployment_ready=1
                break
              fi
            else
              echo "[production-smoke] latest Pages build is not available yet."
            fi
            sleep 10
          done

          if [[ "${deployment_ready}" -ne 1 ]]; then
            echo "::error::Pages never reported a successful latest build for exact SHA ${GITHUB_SHA}."
            cat "${pages_file}" || true
            exit 1
          fi

          echo "[production-smoke] exact SHA is built; verifying public site contract."
          site_ready=0
          for attempt in $(seq 1 12); do
            echo "[production-smoke] site attempt ${attempt}/12: ${BASE_URL}"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${BASE_URL}?smoke=${GITHUB_SHA}" -o "${index_file}"; then
              if grep -Fq '<title>D&D 5e Character Forge | RAW 2014 & 2024 Pregen Generator</title>' "${index_file}" \
                && grep -Fq 'Rules edition' "${index_file}" \
                && grep -Fq 'Warlock' "${index_file}"; then
                site_ready=1
                break
              fi
              echo "[production-smoke] public response does not match the expected Forge contract yet."
            else
              echo "[production-smoke] public site is not responding successfully yet."
            fi
            sleep 10
          done

          if [[ "${site_ready}" -ne 1 ]]; then
            echo "::error::Public homepage never reached the expected Character Forge contract."
            exit 1
          fi

          for asset in \
            src/app.js \
            styles/base.css \
            styles/print/premium-dossier.css \
            src/ui/print-dossier.js \
            site.webmanifest; do
            echo "[production-smoke] checking ${asset}"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${BASE_URL}${asset}?smoke=${GITHUB_SHA}" -o /dev/null
          done

          echo "[production-smoke] exact Pages build, live Forge contract, and critical Print V3 assets are healthy."
