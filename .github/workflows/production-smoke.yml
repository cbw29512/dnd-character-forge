name: Production site smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-site-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact production deployment and live Character Forge
        shell: bash
        env:
          NETLIFY_PRODUCTION_URL: ${{ vars.NETLIFY_PRODUCTION_URL }}
          FALLBACK_PAGES_URL: https://cbw29512.github.io/dnd-character-forge/
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/production-smoke.sh
