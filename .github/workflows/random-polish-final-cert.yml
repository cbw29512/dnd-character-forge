name: Final Random polish certification

on:
  push:
    branches: [cert/random-polish-final-20260903]

permissions:
  contents: read

concurrency:
  group: final-random-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  random-polish-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Random polish paths
        run: node --check src/rules/random.js && node --check src/ui/options.js && node --check tests/random-visible-diversity.test.js && node --check tests/random-background-coverage.test.js && node --check tests/random-names.test.js
      - name: Verify Random polish and existing contracts
        run: node --test tests/random-visible-diversity.test.js tests/random-background-coverage.test.js tests/random-names.test.js tests/random-v2.test.js tests/party-forge.test.js
