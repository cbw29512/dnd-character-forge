<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Grave Warden and Oath Beacon</title>
  <desc id="desc">An original fantasy portrait of a vigilant oathbound guardian standing among old grave stones beneath a restrained beacon of warm light.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.52" stop-color="#1f2b39"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="13%" r="64%">
      <stop offset="0" stop-color="#fff4bd" stop-opacity=".92"/>
      <stop offset=".22" stop-color="#d9b75f" stop-opacity=".48"/>
      <stop offset=".62" stop-color="#9a7437" stop-opacity=".09"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2dfcf"/>
      <stop offset=".34" stop-color="#a8adb0"/>
      <stop offset=".67" stop-color="#59636b"/>
      <stop offset="1" stop-color="#c7bea1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset=".5" stop-color="#c89a3d"/>
      <stop offset="1" stop-color="#72501e"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#384552"/>
      <stop offset=".56" stop-color="#17202a"/>
      <stop offset="1" stop-color="#0d1218"/>
    </linearGradient>
    <filter id="mist" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="640" height="800" fill="url(#sky)"/>
