<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Grave Warden and Oath Beacon</title>
  <desc id="desc">An original fantasy portrait of a vigilant oathbound guardian standing among old grave stones beneath a restrained beacon of warm light.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11182a"/>
      <stop offset="0.58" stop-color="#29313b"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="12%" r="72%">
      <stop offset="0" stop-color="#fff5c9" stop-opacity="0.96"/>
      <stop offset="0.25" stop-color="#d8b665" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#8a6a32" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d7c8"/>
      <stop offset="0.4" stop-color="#848a8d"/>
      <stop offset="0.72" stop-color="#3f474d"/>
      <stop offset="1" stop-color="#b3ae93"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3029"/>
      <stop offset="0.55" stop-color="#1b2025"/>
      <stop offset="1" stop-color="#101419"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dc8e"/>
      <stop offset="0.55" stop-color="#aa7f31"/>
      <stop offset="1" stop-color="#61451f"/>
    </linearGradient>
    <filter id="mist" x="-10%" y="-20%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="640" height="800" fill="url(#night)"/>
  <rect width="640" height="800" fill="url(#beacon)"/>

